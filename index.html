    /* Organic Blob Morph Frame */
    .blob-morph {
      border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
      animation: blobMorph 8s ease-in-out infinite alternate;
    }

    @keyframes blobMorph {
      0% {
        border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
      }

      50% {
        border-radius: 40% 60% 70% 30% / 50% 60% 30% 60%;
      }

      100% {
        border-radius: 50% 50% 40% 60% / 60% 40% 60% 40%;
      }
    }

    @keyframes shiningGlow {

      0%,
      100% {
        box-shadow: 0 0 25px rgba(230, 57, 116, 0.4), 0 0 50px rgba(56, 155, 232, 0.3);
      }

      50% {
        box-shadow: 0 0 45px rgba(230, 57, 116, 0.8), 0 0 75px rgba(56, 155, 232, 0.6);
      }
    }

    .animate-shining-glow {
      animation: shiningGlow 3s ease-in-out infinite alternate;
    }

    /* Shimmer Sweep Reflection */
    @keyframes shimmerSweep {
      0% {
        transform: translateX(-150%) translateY(-150%) rotate(45deg);
      }

      50%,
      100% {
        transform: translateX(200%) translateY(200%) rotate(45deg);
      }
    }

    .animate-shimmer-sweep {
      animation: shimmerSweep 4s ease-in-out infinite;
    }

    /* Slow Bouncing Float Animation */
    @keyframes floatBounce {

      0%,
      100% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-12px);
      }
    }

    .animate-float-bounce {
      animation: floatBounce 4s ease-in-out infinite;
    }

    @keyframes blinkCursor {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0;
      }
    }

    .animate-blink {
      animation: blinkCursor 0.8s infinite;
    }

    @keyframes twinkle {

      0%,
      100% {
        opacity: 0.2;
        transform: scale(0.75);
      }

      50% {
        opacity: 1;
        transform: scale(1.35);
      }
    }

    .animate-twinkle {
      animation: twinkle 3s ease-in-out infinite;
    }
  </style>

    function renderText(text) {
      if (!text) return null;
      const regex = /(\*\*.*?\*\*|\*.*?\*)/g;
      const parts = text.split(regex);
      return parts.map((part, i) => {
        if (part.startsWith('**') && part.endsWith('**')) {
          return <strong key={i} className="text-white font-bold">{part.slice(2, -2)}</strong>;
        }
        if (part.startsWith('*') && part.endsWith('*')) {
          return <strong key={i} className="text-white font-bold">{part.slice(1, -1)}</strong>;
        }
        return part;
      });
    }

    function Preloader() {
      const [progress, setProgress] = useState(0);
      const [isExiting, setIsExiting] = useState(false);
      const [isFinished, setIsFinished] = useState(false);

      useEffect(() => {
        const interval = setInterval(() => {
          setProgress((prev) => {
            if (prev >= 100) {
              clearInterval(interval);
              return 100;
            }
            return prev + 4;
          });
        }, 80);

        return () => clearInterval(interval);
      }, []);

      useEffect(() => {
        if (progress >= 100) {
          const exitTimer = setTimeout(() => setIsExiting(true), 200);
          const finishTimer = setTimeout(() => setIsFinished(true), 900);
          return () => {
            clearTimeout(exitTimer);
            clearTimeout(finishTimer);
          };
        }
      }, [progress]);

      if (isFinished) return null;

      return (
        <div
          className={`fixed inset-0 z-50 bg-[#0B0B0E] flex flex-col items-center justify-center p-6 transition-all duration-700 ease-in-out ${isExiting ? '-translate-y-full opacity-0 pointer-events-none' : 'translate-y-0 opacity-100'

    // --- STARFIELD BACKGROUND ---
    function StarfieldBackground() {
      const stars = React.useMemo(() => {
        const starList = [];
        const colors = ['#E63974', '#389BE8', '#F5D647', '#F4F0EA', '#FF70A6'];
        for (let i = 0; i < 85; i++) {
          const top = Math.floor(Math.abs(Math.sin(i * 997 + 1)) * 100);
          const left = Math.floor(Math.abs(Math.cos(i * 7919 + 1)) * 100);
          const size = (i % 4 === 0) ? 3 : (i % 2 === 0) ? 2 : 1.5;
          const duration = (2.0 + (i % 6) * 0.7).toFixed(1);
          const delay = ((i % 8) * 0.4).toFixed(1);
          const color = colors[i % colors.length];
          const opacity = (0.35 + (i % 4) * 0.15).toFixed(2);

          starList.push({
            id: i,
            top: `${top}%`,
            left: `${left}%`,
            width: `${size}px`,
            height: `${size}px`,
            color,
            opacity,
            duration: `${duration}s`,
            delay: `${delay}s`,
            isSparkle: i % 10 === 0
          });
        }
        return starList;
      }, []);

      return (
        <div className="fixed inset-0 pointer-events-none z-0 overflow-hidden select-none">
          {stars.map((star) => (
            star.isSparkle ? (
              <svg
                key={star.id}
                className="absolute animate-twinkle"
                style={{
                  top: star.top,
                  left: star.left,
                  width: '12px',
                  height: '12px',
                  color: star.color,
                  opacity: star.opacity,
                  animationDuration: star.duration,
                  animationDelay: star.delay,
                }}
                viewBox="0 0 24 24"
                fill="currentColor"
              >
                <path d="M12 0L14.59 9.41L24 12L14.59 14.59L12 24L9.41 14.59L0 12L9.41 9.41L12 0Z" />
              </svg>
            ) : (
              <div
                key={star.id}
                className="absolute rounded-full animate-twinkle"
                style={{
                  top: star.top,
                  left: star.left,
                  width: star.width,
                  height: star.height,
                  backgroundColor: star.color,
                  boxShadow: `0 0 6px ${star.color}`,
                  opacity: star.opacity,
                  animationDuration: star.duration,
                  animationDelay: star.delay,
                }}
              />
            )
          ))}
        </div>
      );
    }

                      <span className="px-3.5 py-1 rounded-full bg-[#E63974]/15 text-[#E63974] border border-[#E63974]/30 text-xs font-mono font-bold">
                        Strong Working Knowledge
                      </span>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5 pt-2">
                      {intermediateTech.map((tech, idx) => (
                        <div
                          key={idx}
                          className="group p-5 rounded-2xl bg-[#0B0B0E]/90 border border-[#5C1B33] hover:border-[#E63974] shadow-lg flex flex-col justify-between space-y-4 hover:-translate-y-1 transition-all duration-300"
                        >
                          <div className="flex items-center gap-3">
                            <div className="w-12 h-12 rounded-2xl bg-[#241520] border border-[#E63974]/40 flex items-center justify-center text-[#E63974] shrink-0 group-hover:scale-110 transition-transform">
                              <Icon name={tech.icon} />
                            </div>
                            <div>
                              <h4 className="text-sm font-bold text-white group-hover:text-[#E63974] transition-colors">
                                {tech.name}
                              </h4>
                              <span className="text-[10px] font-mono text-[#B8A3B0] block">
                                {tech.category}
                              </span>
                            </div>
                          </div>

                          <div className="space-y-1.5 pt-1">
                            <div className="flex justify-between items-center text-[10px] font-mono">
                              <span className="px-2.5 py-0.5 rounded-full bg-[#E63974]/20 text-[#E63974] border border-[#E63974]/40 font-bold">
                                Intermediate
                              </span>
                              <span className="text-[#E63974] font-bold">{tech.levelPercent}%</span>
                            </div>

                            <div className="w-full h-1.5 rounded-full bg-[#241520] overflow-hidden p-0.5">
                              <div
                                className="h-full rounded-full bg-gradient-to-r from-[#C22357] via-[#E63974] to-[#FF70A6] transition-all duration-500 shadow-sm"

                              />

                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* GROUP 3: BEGINNER LEVEL (ELECTRIC CYAN THEME) */}
                {(techFilter === 'All' || techFilter === 'Beginner') && (
                  <div className="space-y-4 bg-[#1A1218]/60 p-6 sm:p-8 rounded-3xl border border-[#389BE8]/30 shadow-2xl backdrop-blur-md">

                    <div className="flex items-center justify-between border-b border-[#389BE8]/20 pb-3">

                      <span className="px-3.5 py-1 rounded-full bg-[#389BE8]/15 text-[#389BE8] border border-[#389BE8]/30 text-xs font-mono font-bold">
                        Foundational & Expanding
                      </span>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5 pt-2">
                      {beginnerTech.map((tech, idx) => (
                        <div
                          key={idx}
                          className="group p-5 rounded-2xl bg-[#0B0B0E]/90 border border-[#5C1B33] hover:border-[#389BE8] shadow-lg flex flex-col justify-between space-y-4 hover:-translate-y-1 transition-all duration-300"
                        >
                          <div className="flex items-center gap-3">
                            <div className="w-12 h-12 rounded-2xl bg-[#241520] border border-[#389BE8]/40 flex items-center justify-center text-[#389BE8] shrink-0 group-hover:scale-110 transition-transform">
                              <Icon name={tech.icon} />
                            </div>
                            <div>
                              <h4 className="text-sm font-bold text-white group-hover:text-[#389BE8] transition-colors">
                                {tech.name}
                              </h4>
                              <span className="text-[10px] font-mono text-[#B8A3B0] block">
                                {tech.category}
                              </span>
                            </div>
                          </div>

                          <div className="space-y-1.5 pt-1">

                              <span className="text-[#389BE8] font-bold">{tech.levelPercent}%</span>

                                className="h-full rounded-full bg-gradient-to-r from-[#2A85D0] via-[#389BE8] to-[#60B2F0] transition-all duration-500 shadow-sm"

                            </div>
                          </div>
                        </div>

              </div>

                  </div>

                      <div className="md:col-span-8 space-y-6">
                        {/* Email Direct */}
                        <a
                          href={personalData.socials.email.url}
                          className="flex items-center gap-4 group p-3 rounded-2xl transition-colors hover:bg-white/5"

                          <div className="w-12 h-12 rounded-full border border-white/40 bg-white/5 flex items-center justify-center text-[#E63974] group-hover:border-[#E63974] group-hover:scale-110 transition-all shrink-0">
                            <Icon name="mail" className="w-5 h-5 text-[#E63974]" />
                          </div>
                          <div className="overflow-hidden">
                            <p className="text-[10px] font-mono uppercase text-[#B8A3B0] tracking-widest">Email Direct</p>
                            <h5 className="text-sm sm:text-base font-bold text-white group-hover:text-[#E63974] transition-colors truncate">
                              {personalData.socials.email.username}
                            </h5>
                          </div>
                        </a>

                        {/* Location */}
                        <div className="flex items-center gap-4 p-3 rounded-2xl">
                          <div className="w-12 h-12 rounded-full border border-white/40 bg-white/5 flex items-center justify-center text-[#389BE8] shrink-0">
                            <Icon name="map-pin" className="w-5 h-5 text-[#389BE8]" />

                          <div>
                            <p className="text-[10px] font-mono uppercase text-[#B8A3B0] tracking-widest">Location</p>
                            <h5 className="text-sm sm:text-base font-bold text-white">
                              Jakarta, Indonesia
                            </h5>
                          </div>
                        </div>

                        {/* WhatsApp / Call */}
                        <a
                          href={personalData.socials.whatsapp?.url || "https://wa.me/6285891259937"}
                          target="_blank"
                          rel="noopener noreferrer"
                          className="flex items-center gap-4 group p-3 rounded-2xl transition-colors hover:bg-white/5"
                        >
                          <div className="w-12 h-12 rounded-full border border-white/40 bg-white/5 flex items-center justify-center text-[#F5D647] group-hover:border-[#F5D647] group-hover:scale-110 transition-all shrink-0">
                            <Icon name="phone" className="w-5 h-5 text-[#F5D647]" />
                          </div>
                          <div>
                            <p className="text-[10px] font-mono uppercase text-[#B8A3B0] tracking-widest">WhatsApp / Call</p>
                            <h5 className="text-sm sm:text-base font-bold text-white group-hover:text-[#F5D647] transition-colors">
                              {personalData.socials.whatsapp?.username || "+62 858-9125-9937"}
                            </h5>
                          </div>
                        </a>
                      </div>

                      {/* Right Side: Social Media Circles (Cleanly without barcode/QR) */}
                      <div className="md:col-span-4 flex md:flex-col items-center justify-center gap-4 pt-4 md:pt-0 border-t md:border-t-0 md:border-l border-white/10 md:pl-6">
                        <p className="text-[10px] font-mono uppercase text-[#B8A3B0] tracking-widest hidden md:block text-center mb-1">
                          Socials
                        </p>

                        {/* LinkedIn */}
                        <a
                          href={personalData.socials.linkedin.url}
                          target="_blank"
                          rel="noopener noreferrer"
                          title="LinkedIn"
                          className="w-12 h-12 rounded-full border border-white/40 bg-white/5 hover:border-[#E63974] hover:bg-white/15 hover:scale-110 flex items-center justify-center text-white transition-all shadow-md group"
                        >
                          <Icon name="linkedin" className="w-5 h-5 text-white group-hover:text-[#E63974] transition-colors" />
                        </a>

                        {/* GitHub */}
                        <a
                          href={personalData.socials.github.url}
                          target="_blank"
                          rel="noopener noreferrer"
                          title="GitHub"
                          className="w-12 h-12 rounded-full border border-white/40 bg-white/5 hover:border-[#E63974] hover:bg-white/15 hover:scale-110 flex items-center justify-center text-white transition-all shadow-md group"
                        >
                          <Icon name="github" className="w-5 h-5 text-white group-hover:text-[#E63974] transition-colors" />
                        </a>

                        {/* Direct Email */}
                        <a
                          href={personalData.socials.email.url}
                          title="Send Email"
                          className="w-12 h-12 rounded-full border border-white/40 bg-white/5 hover:border-[#E63974] hover:bg-white/15 hover:scale-110 flex items-center justify-center text-white transition-all shadow-md group"
                        >
                          <Icon name="mail" className="w-5 h-5 text-white group-hover:text-[#E63974] transition-colors" />
                        </a>
                      </div>

                    </div>

                  </div>
                </div>

              </div>

            </div>
          </section>

          {/* FOOTER */}
          <footer className="py-8 bg-[#0B0B0E] border-t border-[#5C1B33] text-center text-xs text-[#B8A3B0]">
            © {new Date().getFullYear()} Maulidatun Nazwa. All rights reserved. Crafted with React & Tailwind CSS.
          </footer>

          {/* Modals */}
          <ProjectModal project={selectedItem} isOpen={!!selectedItem} onClose={() => setSelectedItem(null)} />
          <CertificateModal certificate={selectedCert} isOpen={!!selectedCert} onClose={() => setSelectedCert(null)} />
          <CVModal isOpen={cvOpen} onClose={() => setCvOpen(false)} />

        </div>
      );
    }

    // Render Nazwa React App
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
